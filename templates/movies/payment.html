{% extends "users/basic.html" %}

{% block content %}

<div class="container mt-5 text-center">
    <h2>Complete Payment</h2>

    <p>
        Movie: <strong>{{ booking.movie.name }}</strong>
    </p>

    <p>
        Amount: <strong>₹{{ payment.amount }}</strong>
    </p>

    <button id="pay-btn" class="btn btn-success btn-lg">
        Pay Now
    </button>

    <a href="{% url 'change_seats' booking.id %}" class="btn btn-secondary btn-lg ms-2">
        Change Seats
    </a>
</div>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<script>
    var options = {
        "key": "{{ razorpay_key_id }}",
        "amount": "{{ razorpay_amount }}",
        "currency": "INR",
        "name": "BookMySeat",
        "description": "Movie Ticket Booking",
        "order_id": "{{ razorpay_order_id }}",

    "handler": function (response) {
        fetch("{% url 'verify_payment' %}", {
        method: "POST",
        headers: {
            "Content-Type": "application/x-www-form-urlencoded",
            "X-CSRFToken": "{{ csrf_token }}"
        },
        body: new URLSearchParams({
            "razorpay_payment_id": response.razorpay_payment_id,
            "razorpay_order_id": response.razorpay_order_id,
            "razorpay_signature": response.razorpay_signature
            
        })
    })
    .then(response => response.json())
    .then(data => {
    console.log("VERIFY RESPONSE:", data);

    if (data.status === "success") {
            alert("Payment successful!");
            window.location.href = "/profile/";
        } else {
            alert(data.message || "Payment verification failed.");
        }
    })
    .catch(error => {
        alert("Something went wrong.");
        console.error(error);
    });
}
    };

    var rzp1 = new Razorpay(options);

    rzp1.on('payment.failed', function (response) {
        fetch("{% url 'payment_failed' %}", {
            method: "POST",
            headers: {
                "X-CSRFToken": "{{ csrf_token }}"
        },
        body: new URLSearchParams({
        "razorpay_order_id": "{{ razorpay_order_id }}"
    })
})
    .then(() => {
        alert("Payment failed. Please try again.");
    });
});

    document.getElementById('pay-btn').onclick = function(e) {
        rzp1.open();
        e.preventDefault();
    };
</script>

{% endblock %}
